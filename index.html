<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moving Pictures — Museum Lobby</title>
<style>
  :root{
    --bg:#0f3237; --ink:#f3f5f7; --muted:#b7becd; --gold:#d8b765;
    --card:#0b2529; --frame:#1a1a1a; --line:#2b2b2b; --shadow:0 16px 40px rgba(0,0,0,.40);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,var(--bg),#073036 60%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:28px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 22px}
  h1{font-size:28px;margin:0}
  .hint{color:var(--muted);font-size:14px}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
  .card{position:relative;background:radial-gradient(120% 140% at 10% 0%, #15383d, #0c2429 70%);border:1px solid #153238;border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .frame{position:relative;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden;border:8px solid #3c2e19;box-shadow:inset 0 0 0 2px #a68a58, inset 0 0 0 6px #5a4427}
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .label{margin-top:12px}
  .title{font-weight:800;font-size:18px}
  .subtitle{color:var(--muted);font-size:14px}
  .cta{display:inline-flex;align-items:center;gap:8px;background:#0e1e20;border:1px solid #284349;border-radius:10px;padding:10px 14px;margin-top:12px}
  .cta:hover{transform:translateY(-1px)}

  /* feature row */
  .feature{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;margin:10px 0 28px}
  @media (max-width:900px){.feature{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Moving Pictures — Museum Lobby</h1>
      <div class="hint">Click any poster to enter its room.</div>
    </header>

    <!-- FEATURED: KZAK Radio (kept simple) -->
    <section class="feature">
      <a class="frame" href="room-radio-listen/index.html" title="Enter KZAK Radio">
        <img src="room-radio-listen/img/RadioPoster.png" alt="KZAK • Radio"/>
      </a>
      <div class="card">
        <div class="title">KZAK • Frasier‑Style Fun Radio</div>
        <div class="subtitle">A curated stream of instrumentals & remixes — no chatter, just music.</div>
        <a class="cta" href="room-radio-listen/index.html">Enter this Room</a>
      </div>
    </section>

    <!-- ROOMS GRID: each poster lives in that room's img/ folder -->
    <section class="grid" id="rooms"></section>
  </div>

<script>
// ---- Data: add/rename posters freely; paths are root-relative from the lobby ----
const ROOMS = [
  { key:'narrative', title:'Narrative & Memory',          blurb:'Curated selections. Click the poster or use the button to enter.',
    poster:'room-narrative-memory/img/NarrativePoster.png', target:'room-narrative-memory/index.html' },
  { key:'psychedelia', title:'Psychedelia & Mindscapes',   blurb:'Curated selections. Click the poster or use the button to enter.',
    poster:'room-psychedelia/img/PsychedeliaPoster.png', target:'room-psychedelia/index.html' },
  { key:'musicmotion', title:'Music & Motion',             blurb:'Curated selections. Click the poster or use the button to enter.',
    poster:'room-music-motion/img/MusicMotionPoster.png', target:'room-music-motion/index.html' },
  { key:'industrial',  title:'Industrial & Mechanica',     blurb:'Curated selections. Click the poster or use the button to enter.',
    poster:'room-industrial/img/IndustrialPoster.png', target:'room-industrial/index.html' },
  { key:'ritual',      title:'Ritual Light',               blurb:'Curated selections. Click the poster or use the button to enter.',
    poster:'room-ritual-light/img/RitualLightPoster.png', target:'room-ritual-light/index.html' },
  { key:'echoes',      title:'Echoes of Humanity',         blurb:'Curated selections. Click the poster or use the button to enter.',
    poster:'room-echoes/img/EchoesPoster.png', target:'room-echoes/index.html' },
  { key:'natural',     title:'Natural Histories',          blurb:'Curated selections. Click the poster or use the button to enter.',
    poster:'room-natural-histories/img/NaturalHistoriesPoster.png', target:'room-natural-histories/index.html' },
  { key:'celestial',   title:'Celestial & Abyssal Realms', blurb:'Curated selections. Click the poster or use the button to enter.',
    poster:'room-celestial/img/CelestialPoster.png', target:'room-celestial/index.html' }
];

const grid = document.querySelector('#rooms');
for (const r of ROOMS){
  const card = document.createElement('article');
  card.className = 'card';
  card.innerHTML = `
    <a class="frame" href="${r.target}">
      <img loading="lazy" src="${r.poster}" alt="Poster: ${r.title}">
    </a>
    <div class="label">
      <div class="title">${r.title}</div>
      <div class="subtitle">${r.blurb}</div>
      <a class="cta" href="${r.target}">Enter this Room</a>
    </div>`;
  grid.appendChild(card);
}
</script>
</body>
</html>
