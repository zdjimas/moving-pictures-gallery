name: Deploy root + rooms to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "inline-fallback.html"
      - "content.css"
      - "rooms_manifest.js"
      - "lobby-rooms.js"
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.webp"
      - "*.mp4"
      - "*.mp3"
      - "assets/**"
      - "room-*/**"
      - ".github/workflows/deploy-room-radio-listen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish dir (_site)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -rf _site
          mkdir -p _site

          echo "=== 1) Root site ==="
          [[ -f index.html ]] && install -D -m 0644 index.html _site/index.html || true
          [[ -f inline-fallback.html ]] && install -D -m 0644 inline-fallback.html _site/inline-fallback.html || true
          [[ -f content.css ]] && install -D -m 0644 content.css _site/content.css || true
          [[ -f rooms_manifest.js ]] && install -D -m 0644 rooms_manifest.js _site/rooms_manifest.js || true
          [[ -f lobby-rooms.js ]] && install -D -m 0644 lobby-rooms.js _site/lobby-rooms.js || true

          # Root media beside index.html (images/video/audio) <200 MB each
          for ext in jpg jpeg png webp mp4 mp3; do
            for f in *.$ext; do
              [[ -f "$f" ]] && [[ $(stat -c%s "$f") -lt 209715200 ]] && install -D -m 0644 "$f" "_site/$f"
            done
          done

          # assets/ (optional)
          if [[ -d assets ]]; then
            find assets -type f -size -200M -print0 | while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done
          fi

          echo "=== 2) All room-* subsites ==="
          for room in room-*; do
            [[ -d "$room" ]] || continue
            echo "--- Staging $room ---"

            # Room root: ALL HTML files, CSS, and JS (was index*.html — now *.html to include kzak-uploader.html etc.)
            find "$room" -maxdepth 1 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) -size -200M -print0 \
              | while IFS= read -r -d '' p; do install -D -m 0644 "$p" "_site/$p"; done

            # Known room-root assets you've used historically
            for f in frasier.png default.jpg RadioMusicListening.jpg ZachArt.jpeg CJMURPHY.png FrasierExit.mp4 radio-room-entry.mp4; do
              [[ -f "$room/$f" ]] && install -D -m 0644 "$room/$f" "_site/$room/$f"
            done

            # Welcome audio (Welcome.mp3 / KZAK-Welcome.mp3)
            for g in "$room"/*Welcome*.mp3; do
              [[ -f "$g" ]] && install -D -m 0644 "$g" "_site/${g#./}"
            done

            # Publish ANY images under the room (img/, images/, posters/, thumbs/, etc.),
            # but skip Media/ and MediaBreaks (handled separately below)
            find "$room" -type f \
              \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" -o -iname "*.gif" \) \
              -size -200M \
              -not -path "*/Media/*" -not -path "*/MediaBreaks/*" \
              -print0 | while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done

            # Optional: Bio subfolder within a room
            if [[ -d "$room/Bio" ]]; then
              find "$room/Bio" -type f -size -200M -print0 | while IFS= read -r -d '' p; do
                install -D -m 0644 "$p" "_site/$p"
              done
            fi

            # Media and MediaBreaks (images/audio/video/metadata) <200 MB each
            for sub in Media MediaBreaks; do
              if [[ -d "$room/$sub" ]]; then
                find "$room/$sub" -type f \
                  \( -iname "*.mp3" -o -iname "*.m4a" -o -iname "*.wav" -o -iname "*.ogg" -o -iname "*.flac" \
                   -o -iname "*.mp4" -o -iname "*.m4v" -o -iname "*.webm" \
                   -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \
                   -o -iname "*.txt" -o -iname "*.json" -o -iname "*.xml" \) \
                  -size -200M -print0 | while IFS= read -r -d '' p; do install -D -m 0644 "$p" "_site/$p"; done
              fi
            done
          done

          echo "=== Files staged for publish ==="
          find _site -type f | sort
          du -sh _site || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}
    steps:
      - id: pages_deploy
        uses: actions/deploy-pages@v4
