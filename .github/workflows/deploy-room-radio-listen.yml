name: Deploy room-radio-listen to Pages

on:
  push:
    branches: [ main ]
    paths:
      - "room-radio-listen/**"
      - ".github/workflows/deploy-room-radio-listen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish dir (_site/room-radio-listen)
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/room-radio-listen
          # publish ALL numbered builds (096/097/098/099...) and the plain index.html if present
          cp room-radio-listen/index-*.html _site/room-radio-listen/ 2>/dev/null || true
          cp room-radio-listen/index.html    _site/room-radio-listen/ 2>/dev/null || true
          # styles + classic playlists your player needs
          cp room-radio-listen/content.css              _site/room-radio-listen/ 2>/dev/null || true
          cp room-radio-listen/playlist-*.classic.js    _site/room-radio-listen/ 2>/dev/null || true
          # keep artifact small: do NOT publish Media/*
          echo "Files to publish:" && find _site -maxdepth 3 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
