name: Deploy room-radio-listen to Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "room-radio-listen/**"
      - ".github/workflows/deploy-room-radio-listen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish dir (_site)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/Media
          cp room-radio-listen/index-098.html _site/
          cp room-radio-listen/content.css _site/ 2>/dev/null || true
          cp room-radio-listen/main.js _site/ 2>/dev/null || true
          # playlists (required)
          cp room-radio-listen/playlist-*.classic.js _site/
          # small images (optional)
          cp room-radio-listen/Media/default.jpg _site/Media/ 2>/dev/null || true
          cp room-radio-listen/Media/frasier.png _site/Media/ 2>/dev/null || true

      - name: Upload Pages artifact (room-radio-listen only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
