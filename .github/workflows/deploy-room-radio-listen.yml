name: Deploy room-radio-listen to Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "room-radio-listen/**"
      - ".github/workflows/deploy-room-radio-listen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build a small publish dir that excludes MP3s (stays well under 1 GB)
      - name: Prepare publish dir (_site)
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/Media
          cp room-radio-listen/index-098.html _site/
          cp room-radio-listen/content.css _site/ 2>/dev/nu_
