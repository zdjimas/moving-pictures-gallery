name: Deploy root + rooms to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      # Root / lobby
      - "index.html"
      - "content.css"
      - "rooms_manifest.js"
      - "lobby-rooms.js"
      - "assets/**"
      # Any room subsite (including media/art updates)
      - "room-*/**"
      # Workflow itself
      - ".github/workflows/deploy-room-radio-listen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish dir (_site)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -rf _site
          mkdir -p _site

          echo "=== 1) Root site ==="
          [[ -f index.html ]] && cp -v index.html _site/
          for f in content.css rooms_manifest.js lobby-rooms.js main.css main.js \
                   RadioMusicListening.jpg Wings.png "Wings For Marie.mp4" IMG_*.jpg; do
            [[ -f "$f" ]] && cp -v "$f" _site/ || true
          done
          if [[ -d assets ]]; then
            find assets -type f -size -200M -print0 | while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done
          fi

          echo "=== 2) All room-* subsites ==="
          for room in room-*; do
            [[ -d "$room" ]] || continue
            echo "--- Staging $room ---"

            # HTML / CSS / JS at top-level of each room
            find "$room" -maxdepth 1 -type f \( -name "index*.html" -o -name "*.css" -o -name "*.js" \) -size -200M -print0 \
              | while IFS= read -r -d '' p; do install -D -m 0644 "$p" "_site/$p"; done

            # Room-root assets commonly referenced by the page
            for f in frasier.png default.jpg RadioMusicListening.jpg ZachArt.jpeg CJMURPHY.png \
                     Welcome.mp3 FrasierExit.mp4 radio-room-entry.mp4; do
              [[ -f "$room/$f" ]] && install -D -m 0644 "$room/$f" "_site/$room/$f"
            done

            # Publish Media and MediaBreaks (audio + images used by playlists), size-capped
            for sub in Media MediaBreaks; do
              if [[ -d "$room/$sub" ]]; then
                find "$room/$sub" -type f \
                     \( -iname "*.mp3" -o -iname "*.m4a" -o -iname "*.wav" -o -iname "*.ogg" -o -iname "*.flac" \
                        -o -iname "*.mp4" -o -iname "*.m4v" -o -iname "*.webm" \
                        -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
                     -size -200M -print0 \
                  | while IFS= read -r -d '' p; do install -D -m 0644 "$p" "_site/$p"; done
              fi
            done
          done

          echo "=== Files staged for publish ==="
          find _site -type f | sort
          du -sh _site || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
