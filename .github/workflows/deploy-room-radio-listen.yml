name: Deploy root + rooms to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "content.css"
      - "assets/**"
      - "room-*/**"
      - ".github/workflows/deploy-room-radio-listen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

name: Deploy root + rooms to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "content.css"
      - "assets/**"
      - "room-*/**"
      - ".github/workflows/deploy-room-radio-listen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish dir (_site)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -rf _site
                                                                                             
