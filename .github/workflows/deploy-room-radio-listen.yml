name: Deploy root + rooms to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      # Root / lobby
      - "index.html"
      - "content.css"
      - "rooms_manifest.js"
      - "lobby-rooms.js"
      - "assets/**"
      # Any room subsite
      - "room-*/**"
      # Workflow itself
      - ".github/workflows/deploy-room-radio-listen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish dir (_site)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -rf _site
          mkdir -p _site

          echo "=== 1) Root site ==="
          # Required entry
          [[ -f index.html ]] && cp -v index.html _site/

          # Common root assets (copy if present)
          for f in content.css rooms_manifest.js lobby-rooms.js main.css main.js \
                   RadioMusicListening.jpg Wings.png "Wings For Marie.mp4" IMG_*.jpg; do
            [[ -f "$f" ]] && cp -v "$f" _site/ || true
          done

          # Copy small files from assets/ (skip anything >= 200MB)
          if [[ -d assets ]]; then
            while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done < <(find assets -type f -size -200M -print0)
          fi

          echo "=== 2) All room-* subsites ==="
          for room in room-*; do
            [[ -d "$room" ]] || continue
            echo "--- Staging $room ---"

            # HTML, CSS, JS
            while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done < <(find "$room" -maxdepth 1 -type f \( -name "index*.html" -o -name "*.css" -o -name "*.js" \) -size -200M -print0)

            # Small images/artwork commonly referenced by pages
            while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done < <(find "$room" -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" -o -iname "*.svg" \) -size -200M -print0)

            # Media: only allow intros / welcome clips (avoid shipping full catalog)
            if [[ -d "$room/Media" ]]; then
              while IFS= read -r -d '' p; do
                install -D -m 0644 "$p" "_site/$p"
              done < <(find "$room/Media" -maxdepth 1 -type f \
                        \( -iname "*welcome*.mp3" -o -iname "KZAK-Welcome.mp3" -o -iname "*intro*.mp3" -o -iname "*entry*.mp4" \) \
                        -size -200M -print0)
            fi
          done

          echo "=== Files staged for publish ==="
          find _site -type f | sort
          echo "Total size:"
          du -sh _site || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
