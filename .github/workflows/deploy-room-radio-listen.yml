 name: Deploy root + rooms to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "content.css"
      - "assets/**"
      - "room-*/**.html"
      - "room-*/**.css"
      - "room-*/**.js"
      - "room-*/Media/*.mp4"
      - ".github/workflows/deploy-room-radio-listen.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish dir (_site)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -rf _site
          mkdir -p _site

          echo "=== 1) Root site ==="
          [[ -f index.html ]] && cp -v index.html _site/
          # Copy small, optional root assets (add/remove as needed)
          for f in content.css main.css main.js \
                   RadioMusicListening.jpg Wings.png "Wings For Marie.mp4"; do
            [[ -f "$f" ]] && cp -v "$f" _site/ || true
          done
          # Copy small files from /assets if present (keeps artifact lean)
          if [[ -d assets ]]; then
            find assets -type f -size -200M -print0 | while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done
          fi

          echo "=== 2) room-radio-listen subsite ==="
          mkdir -p _site/room-radio-listen
          # Publish index*.html (numbered and plain)
          cp -v room-radio-listen/index*.html _site/room-radio-listen/ 2>/dev/null || true
          # Supporting assets (no large Media/*)
          for f in content.css main.js playlist-*.js radio-room-entry.mp4 \
                   frasier.png default.jpg RadioMusicListening.jpg; do
            [[ -f "room-radio-listen/$f" ]] && cp -v "room-radio-listen/$f" _site/room-radio-listen/ || true
          done
          # Allow small intro/welcome media only; DO NOT ship the music library
          if [[ -d room-radio-listen/Media ]]; then
            find room-radio-listen/Media -maxdepth 1 -type f \
                 \( -name "*entry*.mp4" -o -name "*intro*.mp4" -o -name "KZAK-Welcome.mp3" \) \
                 -size -200M -print0 | while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done
          fi

          echo "Files staged for publish:"
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
