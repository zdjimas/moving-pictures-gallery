name: Deploy root + rooms to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "inline-fallback.html"
      - "content.css"
      - "rooms_manifest.js"
      - "lobby-rooms.js"
      - "Bio/**"
      - "Media/**"
      - "MediaBreaks/**"
      - "room-*/**"
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.webp"
      - "*.mp4"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish dir (_site)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -rf _site
          mkdir -p _site

          # --- 1) Root site files (HTML/CSS/JS + common assets) ---
          for f in index.html inline-fallback.html content.css rooms_manifest.js lobby-rooms.js; do
            if [[ -f "$f" ]]; then
              install -D -m 0644 "$f" "_site/$f"
            fi
          done

          # Copy any top-level images/videos you keep beside index.html
          find . -maxdepth 1 -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" -o -iname "*.gif" -o -iname "*.mp4" \) \
            -size -200M -print0 | while IFS= read -r -d '' p; do
              p="${p#./}"
              install -D -m 0644 "$p" "_site/$p"
            done

          # --- 2) Bio pages (HTML + images) ---
          if [[ -d Bio ]]; then
            # HTML
            find Bio -type f \( -iname "*.html" -o -iname "*.htm" \) -size -200M -print0 | while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done
            # Images
            find Bio -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" -o -iname "*.gif" \) \
              -size -200M -print0 | while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done
          fi

          # --- 3) Rooms: HTML/CSS/JS & ANY images (outside Media/MediaBreaks) ---
          for room in room-*; do
            [[ -d "$room" ]] || continue

            # Copy common room-root assets
            find "$room" -maxdepth 1 -type f \
              \( -iname "*.html" -o -iname "*.htm" -o -iname "*.css" -o -iname "*.js" -o -iname "*.mp4" \) \
              -size -200M -print0 | while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done

            # Copy ANY images anywhere under the room (posters, img/, images/, thumbs/, etc.)
            # but skip Media/ and MediaBreaks/ (handled in section 4).
            find "$room" -type f \
              \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" -o -iname "*.gif" \) \
              -size -200M \
              -not -path "*/Media/*" -not -path "*/MediaBreaks/*" \
              -print0 | while IFS= read -r -d '' p; do
              install -D -m 0644 "$p" "_site/$p"
            done
          done

          # --- 4) Media and MediaBreaks trees (as before) ---
          for tree in Media MediaBreaks; do
            if [[ -d "$tree" ]]; then
              # Images / covers
              find "$tree" -type f \
                \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" -o -iname "*.gif" \) \
                -size -200M -print0 | while IFS= read -r -d '' p; do
                install -D -m 0644 "$p" "_site/$p"
              done

              # Audio / video (if you stage any small clips here)
              find "$tree" -type f \
                \( -iname "*.mp3" -o -iname "*.m4a" -o -iname "*.wav" -o -iname "*.flac" -o -iname "*.mp4" \) \
                -size -200M -print0 | while IFS= read -r -d '' p; do
                install -D -m 0644 "$p" "_site/$p"
              done

              # Text metadata (optional)
              find "$tree" -type f \( -iname "*.txt" -o -iname "*.json" -o -iname "*.xml" \) \
                -size -200M -print0 | while IFS= read -r -d '' p; do
                install -D -m 0644 "$p" "_site/$p"
              done
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - id: deployment
        uses: actions/deploy-pages@v4
