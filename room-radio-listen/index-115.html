<!doctype html>
<html lang="en">
<head>
<!-- KZAK media-path shim v1.103 -->



<!-- Media Session: keep song on lock screen during breaks -->








<!-- KZAK v1.115: Exit overlay with fixed 37s fallback -->
<script>
(function(){
  try{
    const FALLBACK_MS = 37000; // exactly 37 seconds

    function ensureExitOverlay(){
      var overlay = document.getElementById('exitOverlay');
      if (!overlay){
        overlay = document.createElement('div');
        overlay.id = 'exitOverlay';
        overlay.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.85);z-index:99999';
        document.body.appendChild(overlay);
      }
      var video = document.getElementById('exitVideo');
      if (!video){
        video = document.createElement('video');
        video.id = 'exitVideo';
        video.setAttribute('playsinline','');
        video.setAttribute('preload','auto');
        video.style.cssText = 'max-width:min(100vw,1200px);max-height:100vh;width:100%;background:#000;border-radius:12px;box-shadow:0 30px 90px rgba(0,0,0,.6)';
        overlay.appendChild(video);
      }
      return { overlay, video };
    }

    function pauseAll(){
      try{ Array.from(document.querySelectorAll('audio')).forEach(a=>{ try{ a.pause(); a.muted = true; }catch(e){} }); }catch(e){}
      try{ if (window.audio && typeof window.audio.pause==='function'){ window.audio.pause(); window.audio.muted=true; } }catch(e){}
      try{ if (window.breakAudio && typeof window.breakAudio.pause==='function'){ window.breakAudio.pause(); window.breakAudio.muted=true; } }catch(e){}
    }

    function playExitThenNav(){
      let tNav = null, navigated = false;
      const nav = () => { if (navigated) return; navigated = true; location.href = '../index.html'; };
      const clearTimer = () => { if (tNav){ clearTimeout(tNav); tNav = null; } };

      const { overlay, video } = ensureExitOverlay();
      overlay.style.display = 'grid';
      try { video.src = 'FrasierExit.mp4'; video.load(); } catch(e){}

      // Fixed fallback to 37s so we never leave early
      tNav = setTimeout(nav, FALLBACK_MS);

      video.addEventListener('ended', () => { clearTimer(); nav(); }, { once:true });
      video.addEventListener('error', () => { clearTimer(); nav(); }, { once:true });

      try {
        const p = video.play();
        if (p && p.catch) p.catch(()=>{/* fallback already set */});
      } catch(e) { /* fallback already set */ }
    }

    // Bind Return to Lobby
    document.addEventListener('click', function(ev){
      let el = ev.target;
      let txt = (el && el.textContent || '').toLowerCase();
      let hops = 0;
      while (el && hops++ < 3 && (!txt || !txt.trim())) {
        el = el.parentElement;
        txt = (el && el.textContent || '').toLowerCase();
      }
      if (txt && /\breturn\s+to\s+lobby\b/.test(txt)){
        ev.preventDefault();
        pauseAll();
        playExitThenNav();
      }
    }, true);
  }catch(err){ console.warn('v1.115 exit overlay error', err); }
})();
</script>

</body>
</html>
