 <!doctype html>
<html lang="en">
<head>
  <base href="/moving-pictures-gallery/room-radio-listen/">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KZAK • Frasier-Style Radio</title>
  <meta name="color-scheme" content="dark light"/>

  <style>
    :root{--ink:#e6e9ef;--muted:#9aa4b2;--line:#22324d;--glass:rgba(14,22,40,.82);--bg:#0b1220}
    html,body{height:100%;margin:0}
    body{background:#0b1220 url('Media/RadioMusicListening.jpg') center/cover fixed no-repeat;color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{max-width:1200px;margin:0 auto;padding:22px}
    h1{margin:0 0 6px 0}
    .muted{color:var(--muted)}
    .bar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
    .btn{background:#101a2d;border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:12px;cursor:pointer}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:#0e1628}
    .dot{width:10px;height:10px;border-radius:50%;background:#49576b}
    .on .dot{background:#ff3b3b;box-shadow:0 0 10px rgba(255,59,59,.8)}
    .grid{display:grid;grid-template-columns:1fr 380px;gap:20px}
    @media (max-width:980px){.grid{grid-template-columns:1fr}}
    .panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px)}
    .head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
    .body{padding:12px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .scrub{display:grid;grid-template-columns:52px 1fr 56px;gap:10px;align-items:center;margin:8px 0}
    .track{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:flex-start}
    @media (max-width:640px){.track{grid-template-columns:1fr}}
    .art{width:170px;height:170px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0e1628}
    .art img{width:100%;height:100%;object-fit:cover}
    .list{max-height:472px;overflow:auto}
    .item{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:8px;cursor:pointer}
    .item:hover{background:rgba(255,255,255,.05)}
    .item.active{background:rgba(168,200,255,.10)}
    .tiny{font-size:12px;color:var(--muted)}
    .badge{position:fixed;right:10px;bottom:10px;background:#0e1628;border:1px solid var(--line);padding:10px 12px;border-radius:12px;opacity:.92}
    /* hide any legacy “UNCLE …” overlays or injectors */
    .build-badge,[data-build-badge],.uncle-build,[data-uncle]{display:none!important}
    /* welcome overlay */
    .overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.35);z-index:9999}
    .overlay.show{display:grid}
    .frame{max-width:720px;margin:0 16px;border-radius:14px;padding:16px;background:rgba(0,0,0,.6);border:1px solid var(--line)}
  </style>

  <!-- Load playlists (no cache-busting, no hotfix patches) -->
  <script src="playlist-rock.js"></script>
  <script src="playlist-heavy.js"></script>
  <script src="playlist-mellow.js"></script>

  <!-- Optional likes file; safe if missing -->
  <script src="kzak-likes-059.js" defer></script>

  <script>
    // Bind any legacy globals to the expected names (048 compatibility)
    (function(){
      try{
        if (typeof PLAYLIST_ROCK   === 'undefined' && Array.isArray(window.PLAYLIST)) window.PLAYLIST_ROCK   = window.PLAYLIST;
        if (typeof PLAYLIST_HEAVY  === 'undefined' && Array.isArray(window.HEAVY))   window.PLAYLIST_HEAVY  = window.HEAVY;
        if (typeof PLAYLIST_MELLOW === 'undefined' && Array.isArray(window.MELLOW))  window.PLAYLIST_MELLOW = window.MELLOW;
      }catch(e){}
      // choose a safe default list for boot
      window.PLAYLIST = Array.isArray(window.PLAYLIST_ROCK) && window.PLAYLIST_ROCK.length
        ? window.PLAYLIST_ROCK.slice()
        : (Array.isArray(window.PLAYLIST_HEAVY)&&window.PLAYLIST_HEAVY.length?window.PLAYLIST_HEAVY.slice()
          : (Array.isArray(window.PLAYLIST_MELLOW)&&window.PLAYLIST_MELLOW.length?window.PLAYLIST_MELLOW.slice():[]));
    })();
  </script>
</head>
<body>

<div class="wrap">
  <header class="row">
    <div class="pill" id="onAir"><span class="dot"></span><strong>ON AIR</strong></div>
    <div class="muted">KZAK • Frasier-Style Fun Radio</div>
    <div class="muted" style="margin-left:auto"><span id="tcount">0</span> items</div>
  </header>

  <!-- Genre -->
  <div class="bar" id="genres">
    <button class="btn g" data-genre="Heavy and Metal">Heavy and Metal</button>
    <button class="btn g" data-genre="Middle Ground Rock">Middle Ground Rock</button>
    <button class="btn g" data-genre="Mellow Tunes">Mellow Tunes</button>
    <button class="btn g active" data-genre="ALL">ALL</button>
    <button class="btn" id="likeBtn">♡ Like Track</button>
  </div>

  <div class="grid">
    <!-- Player -->
    <section class="panel">
      <div class="head">
        <div class="row">
          <button class="btn" id="prevBtn">⟸ Prev</button>
          <button class="btn" id="nextBtn">Next ⟹</button>
        </div>
        <div class="row">
          <div>Vol</div>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.86" style="width:160px"/>
        </div>
      </div>
      <div class="body">
        <div class="scrub">
          <div id="elapsed">0:00</div>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1"/>
          <div id="remaining">-0:00</div>
        </div>
        <div class="row tiny">
          <div>TRACK <span id="tpos">0</span> / <span id="tmax">0</span></div>
          <div style="margin-left:auto">Status: <span id="meta">Stopped</span></div>
        </div>
        <div class="row track" style="margin-top:10px">
          <div class="art"><img id="art" alt="" src="Media/default.jpg"></div>
          <div>
            <div class="tiny muted" id="genreNow">Genre: —</div>
            <h3 id="title" style="margin:.25rem 0">—</h3>
            <div class="muted" id="story">Under Construction…</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Playlist -->
    <aside class="panel">
      <div class="head"><strong>Playlist</strong><div class="tiny" id="countRight"></div></div>
      <div class="body list" id="plist"></div>
    </aside>
  </div>
</div>

<!-- Welcome (kept, but lightweight) -->
<div id="welcome" class="overlay show" aria-modal="true" role="dialog">
  <div class="frame">
    <h2 style="margin:0 0 6px 0;color:#ffeb7a">🎙️ Welcome to KZAK</h2>
    <p class="muted" style="margin-top:0">Click Start to begin. ON AIR lights when music plays.</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="startBtn">▶︎ Start Station</button>
      <button class="btn" id="skipBtn">Skip</button>
    </div>
  </div>
</div>

<!-- Tidy single badge -->
<div class="badge tiny" id="badge">Release: Bullwinkle-v1.078<br/><span id="when"></span></div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>
/* ---------- Small helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const fmt = t => {t|=0; const m=(t/60)|0, s=(t%60)|0; return m+':' + (s<10?'0':'')+s};
function setBadgeTime(){ try{ $('#when').textContent = new Date().toLocaleString(); }catch(e){} }

/* ---------- State ---------- */
const audio = $('#audio');
const elements = {
  onAir: $('#onAir'), title:$('#title'), story:$('#story'), art:$('#art'),
  meta:$('#meta'), tpos:$('#tpos'), tmax:$('#tmax'), tcount:$('#tcount'),
  plist:$('#plist'), countRight:$('#countRight'), seek:$('#seek'),
  elapsed:$('#elapsed'), remaining:$('#remaining'), genreNow:$('#genreNow'),
  likeBtn:$('#likeBtn')
};

let LIB = {
  ALL: (Array.isArray(window.PLAYLIST_ROCK)?window.PLAYLIST_ROCK:[])
       .concat(Array.isArray(window.PLAYLIST_HEAVY)?window.PLAYLIST_HEAVY:[])
       .concat(Array.isArray(window.PLAYLIST_MELLOW)?window.PLAYLIST_MELLOW:[]),
  'Heavy and Metal': Array.isArray(window.PLAYLIST_HEAVY)?window.PLAYLIST_HEAVY:[],
  'Middle Ground Rock': Array.isArray(window.PLAYLIST_ROCK)?window.PLAYLIST_ROCK:[],
  'Mellow Tunes': Array.isArray(window.PLAYLIST_MELLOW)?window.PLAYLIST_MELLOW:[]
};

let GENRE = 'ALL';
let PLAYLIST = LIB[GENRE].slice();   // filtered working list
let idx = 0, isPlaying = false, isScrubbing = false;
const DEFAULT_IMG = "Media/default.jpg";
const DEFAULT_STORY = "Under Construction: a special write-up about this specific music creation…";

/* ---------- Likes (localStorage; safe even if kzak-likes-059.js is absent) ---------- */
const LIKE_KEY = 'kzakLikes';
function getLikes(){ try{ return JSON.parse(localStorage.getItem(LIKE_KEY)||'{}'); }catch{ return {}; } }
function setLikes(m){ try{ localStorage.setItem(LIKE_KEY, JSON.stringify(m)); }catch{} }
function keyFor(tr){ return (tr.file||tr.title||'').toString(); }
function isLiked(tr){ const m=getLikes(); return !!m[keyFor(tr)]; }
function toggleLike(tr){
  const m = getLikes(); const k = keyFor(tr);
  if (m[k]) delete m[k]; else m[k]=1; setLikes(m);
  paintLike(tr);
}
function paintLike(tr){
  try{
    elements.likeBtn.textContent = (isLiked(tr)?'♥ Unlike':'♡ Like Track');
  }catch(e){}
}

/* ---------- Build / Render ---------- */
function safe(t,alt){ return (t && typeof t === 'string' && t.trim()) ? t : alt; }
function artFor(tr){ return safe(tr.image||tr.img, DEFAULT_IMG) }
function storyFor(tr){ return safe(tr.story, DEFAULT_STORY) }
function genreFor(tr){ return safe(tr.genre, '—') }

function buildList(){
  elements.plist.innerHTML='';
  PLAYLIST.forEach((tr,i)=>{
    const d=document.createElement('div');
    d.className='item'; d.dataset.i=i;
    d.innerHTML = `<div><strong>${String(i+1).padStart(3,'0')}</strong> ${tr.title}
      <div class="tiny">${tr.file||''}</div></div>
      <div class="tiny">▶︎</div>`;
    d.addEventListener('click',()=>load(i,true));
    elements.plist.appendChild(d);
  });
  elements.tmax.textContent = PLAYLIST.length;
  elements.tcount.textContent = PLAYLIST.length;
  elements.countRight.textContent = PLAYLIST.length + ' items';
}

function markActive(){
  $$('#plist .item').forEach(n=>n.classList.toggle('active', Number(n.dataset.i)===idx));
}

/* ---------- Load / Play ---------- */
function timeTick(){
  if (!isPlaying || isScrubbing) return;
  const d = Number.isFinite(audio.duration)?audio.duration:0;
  const ct= Number.isFinite(audio.currentTime)?audio.currentTime:0;
  elements.elapsed.textContent = fmt(ct|0);
  elements.remaining.textContent = d>0 ? ('-'+fmt(Math.max(d-ct,0)|0)) : '-0:00';
  if (d>0) elements.seek.value = Math.round((ct/d)*1000);
  requestAnimationFrame(timeTick);
}

function setDeepLink(i){
  try{
    const u=new URL(location.href); u.searchParams.set('t', i|0);
    history.replaceState({},'',u);
  }catch(e){}
}

function load(i, autoplay=false){
  idx = (i + PLAYLIST.length) % PLAYLIST.length;
  const tr = PLAYLIST[idx];
  elements.title.textContent = tr.title || '—';
  elements.story.textContent = storyFor(tr);
  elements.art.src = artFor(tr);
  elements.genreNow.textContent = 'Genre: ' + genreFor(tr);
  elements.tpos.textContent = idx + 1;
  elements.meta.textContent = 'Queued';
  elements.seek.value = 0;
  setDeepLink(idx);
  paintLike(tr);
  markActive();

  // choose a playable URL; try declared file first, then a safe fallback with encoding
  const src = (tr.file ? encodeURI(tr.file).replace(/#/g,'%23') : null);
  if (!src){ elements.meta.textContent='Missing file'; return; }

  audio.src = src; audio.load();
  let armed = false;
  const onReady = ()=>{ if(armed) return; armed=true; elements.meta.textContent='Ready'; if(autoplay) play(); };
  audio.addEventListener('loadedmetadata', onReady, {once:true});
  audio.addEventListener('canplay', onReady, {once:true});
  audio.addEventListener('error', ()=>{ elements.meta.textContent='Load error'; if(autoplay) next(); }, {once:true});
}

function play(){
  audio.play().then(()=>{
    isPlaying=true; elements.meta.textContent='Playing';
    $('#onAir').classList.add('on'); requestAnimationFrame(timeTick);
  }).catch(()=>{ elements.meta.textContent='Tap Start to play'; });
}
function pause(){ audio.pause(); isPlaying=false; $('#onAir').classList.remove('on'); elements.meta.textContent='Paused'; }

function next(){ load(idx+1, true); }
function prev(){ load(idx-1, true); }

/* ---------- Wire UI ---------- */
$('#nextBtn').addEventListener('click', next);
$('#prevBtn').addEventListener('click', prev);
$('#vol').addEventListener('input', e=> audio.volume = Number(e.target.value)||0);

elements.seek.addEventListener('pointerdown', ()=>{ isScrubbing=true; });
elements.seek.addEventListener('pointerup',   ()=>{ isScrubbing=false; });
elements.seek.addEventListener('input', e=>{
  const d=audio.duration||0; if(!d) return;
  audio.currentTime = (Number(e.target.value)/1000)*d;
});

elements.likeBtn.addEventListener('click', ()=>{ const tr=PLAYLIST[idx]; if(tr) toggleLike(tr); });

audio.addEventListener('ended', next);

/* Genre switching (rebuild filtered list, then load first) */
$('#genres').addEventListener('click', e=>{
  const b = e.target.closest('.g'); if(!b) return;
  $$('#genres .g').forEach(n=>n.classList.toggle('active', n===b));
  GENRE = b.dataset.genre;
  PLAYLIST = (GENRE==='ALL') ? LIB.ALL.slice() : LIB[GENRE].slice();
  if (!Array.isArray(PLAYLIST) || PLAYLIST.length===0){
    elements.plist.innerHTML = '<div class="tiny">No tracks for this genre.</div>';
    elements.tmax.textContent = '0'; elements.countRight.textContent='0 items'; elements.tcount.textContent='0';
    pause(); return;
  }
  idx = 0; buildList(); load(0, true);
});

/* ---------- Welcome ---------- */
function startNow(){ $('#welcome').classList.remove('show'); if(!PLAYLIST.length){ elements.meta.textContent='No tracks'; return; } load(idx, true); }
$('#startBtn').addEventListener('click', startNow);
$('#skipBtn').addEventListener('click', startNow);

/* ---------- Boot ---------- */
(function boot(){
  setBadgeTime();

  // If deep link ?t=N exists, honor it
  try{
    const t = Number(new URL(location.href).searchParams.get('t'));
    if (Number.isFinite(t) && t>=0) idx = Math.min(Math.max(0,t|0), Math.max(0, (PLAYLIST.length-1)));
  }catch(e){}

  buildList();
  markActive();
})();
</script>
</body>
</html>
