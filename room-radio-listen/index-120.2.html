<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>KZAK • Frasier-Style Fun Radio without the talking</title>
<base href='/moving-pictures-gallery/room-radio-listen/'>
<script>
// expose helper for breaks and images
window.MEDIA_BASE='https://raw.githubusercontent.com/zdjimas/moving-pictures-gallery/main/room-radio-listen/';
window.pathToUrl=function(p){try{if(!p)return p;if(/^https?:\/\//i.test(p))return p;const clean=String(p).replace(/^(\.\/)+/,'');const enc=clean.split('/').map(seg=>encodeURIComponent(seg)).join('/');return new URL(enc,window.MEDIA_BASE).href;}catch(e){return p;}};
</script>
</head>
<body>
<h1>KZAK v120.2 (minimal shell to unblock)</h1>
<p>This minimal build exposes the correct break logic and boot flow. Replace later with your full styled file once validated.</p>

<button id="start">Start</button>
<button id="forceBreak">Force Break</button>
<div id="status"></div>

<audio id="player" preload="none" crossorigin="anonymous"></audio>
<audio id="breakAudio" preload="auto"></audio>

<script src="playlist-rock.classic.js"></script>
<script src="playlist-heavy.classic.js"></script>
<script src="playlist-mellow.classic.js"></script>

<script>
const ROCK=(window.PLAYLIST_ROCK||[]).map(x=>({...x,genre:'Middle Ground Rock'}));
const HEAVY=(window.PLAYLIST_HEAVY||[]).map(x=>({...x,genre:'Heavy and Metal'}));
const MELLOW=(window.PLAYLIST_MELLOW||[]).map(x=>({...x,genre:'Mellow Tunes'}));
let LIST=[...ROCK,...HEAVY,...MELLOW];

const audio=document.getElementById('player');
const breakAudio=document.getElementById('breakAudio');
const status=document.getElementById('status');
let idx=0;

function load(i,autoplay=false){
  idx=(i+LIST.length)%LIST.length;
  const tr=LIST[idx];
  audio.src = encodeURI(tr.file);
  audio.load();
  if (autoplay) audio.play();
  status.textContent='Loaded: '+tr.title;
}
audio.addEventListener('ended',()=>playBreakThen(()=>load(idx+1,true)));

document.getElementById('start').onclick=()=>{load(0,true)};
document.getElementById('forceBreak').onclick=()=>playBreakThen(()=>{});

let BREAKS=[
  "MediaBreaks/AishaPatelYouarelisteningtoK-Z-A-K.wav",
  "MediaBreaks/AmyYourelisteningtoK-ZACHt.mp3",
  "MediaBreaks/Radio-ID-Seven.mp3",
  "MediaBreaks/Radio-ID-Six.mp3",
  "MediaBreaks/Radio-Id-Ad-workforce1.mp3",
  "MediaBreaks/Radio-Id-Ad-workforce2.mp3",
  "MediaBreaks/Radio-Id-Five.mp3",
  "MediaBreaks/Radio-Id-Four.mp3",
  "MediaBreaks/Radio-Id-One.mp3",
  "MediaBreaks/Radio-Id-Three.mp3",
  "MediaBreaks/Radio-Id-Two.mp3",
  "MediaBreaks/Snappy1.mp3","MediaBreaks/Snappy2.mp3","MediaBreaks/Snappy3.mp3","MediaBreaks/Snappy4.mp3","MediaBreaks/snappy5.mp3",
  "MediaBreaks/Snappy6.mp3","MediaBreaks/Snappy7.mp3","MediaBreaks/Snappy8.mp3","MediaBreaks/Snappy9.mp3","MediaBreaks/Snappy10.mp3",
  "MediaBreaks/Snappy11.mp3","MediaBreaks/Snappy12.mp3","MediaBreaks/Snappy13.mp3","MediaBreaks/Snappy14.mp3","MediaBreaks/Snappy15.mp3",
  "MediaBreaks/Snappy16.mp3","MediaBreaks/Snappy17.mp3","MediaBreaks/Snappy18.mp3","MediaBreaks/Snappy19.mp3","MediaBreaks/Snappy20.mp3",
  "MediaBreaks/Snappy21.mp3","MediaBreaks/Snappy22.mp3","MediaBreaks/Snappy23.mp3",
  "MediaBreaks/en-US-Journey-D-K_ZACH___where_the_f.wav",
  "MediaBreaks/en-US-Journey-DYouaretunedintoK-Z-A-Kb.mp3",
  "MediaBreaks/en-US-News-NThisisK-Z-A-Kbringingyou.mp3"
];
let lastBreak=-1;
function pickBreak(){if(!BREAKS.length)return null;if(BREAKS.length===1)return BREAKS[0];let i;do{i=(Math.random()*BREAKS.length)|0;}while(i===lastBreak);lastBreak=i;return BREAKS[i];}
function playBreakThen(cb){
  const b=pickBreak(); if(!b){cb&&cb();return;}
  breakAudio.src=window.pathToUrl(b);
  breakAudio.play().then(()=>breakAudio.addEventListener('ended',()=>cb&&cb(),{once:true})).catch(()=>cb&&cb());
}
</script>
</body>
</html>
