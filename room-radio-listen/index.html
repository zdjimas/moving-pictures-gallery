<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KZAK Now Playing Test</title></head>
<body style="font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:20px">
<h1>Now Playing • Lock Screen Test</h1><p>Tap Play, lock iPhone, confirm Lock Screen shows title & artwork.</p>
<audio id="a" src="Media/RadioID1.mp3" preload="metadata"></audio>
<button id="playBtn" style="font-size:18px;padding:12px 16px">Play</button>
<script>(async function(){const a=document.getElementById('a');const b=document.getElementById('playBtn');function abs(u){try{return new URL(u,location.href).href}catch{return u}}async function pub(){if(!('mediaSession'in navigator))return;const ms=navigator.mediaSession;const art=abs('Media/default.jpg');ms.metadata=new MediaMetadata({title:'KZAK Test Title',artist:'KZAK',album:'Test',artwork:[{src:art,sizes:'96x96',type:'image/jpeg'},{src:art,sizes:'512x512',type:'image/jpeg'}]});if('setPositionState'in ms){try{ms.setPositionState({duration:a.duration||0,position:a.currentTime||0,playbackRate:1})}catch(e){}}}b.addEventListener('click',async()=>{try{await a.play();await pub();setInterval(pub,1500)}catch(e){console.warn('play failed',e)}})})()</script>
</body></html>
