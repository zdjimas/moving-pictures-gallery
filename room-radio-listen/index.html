<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KZAK • Frasier-Style Fun Radio — UNCLE7</title>
  <meta name="description" content="KZAK • Frasier-Style Fun Radio without the talking. UNCLE7 baseline with Media Session, balanced station breaks, resilient artwork, and intro/exit flows." />
  <style>
    :root{
      --ink:#e6e9ef; --muted:#a6adbb; --brand:#89b4fa; --accent:#a6e3a1; --danger:#f38ba8;
      --card:#111827; --panel:#0b1220; --line:#22324d; --shadow:0 18px 50px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--ink); background:#0a0f1a;
      font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background-image: linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,.85)), url('Media/RadioMusicListening.jpg');
      background-size:cover; background-position:center; background-attachment:fixed;
    }
    .wrap{max-width:1100px; margin:0 auto; padding:16px}
    .toolbar{
      display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--panel);
      border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); margin-top:12px;
    }
    .btn{background:#1b2a4a; color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer}
    .btn:hover{background:#22375f}
    .btn.primary{background:var(--brand); color:#0b1220; border-color:transparent}
    .btn.danger{background:#3b1b26; border-color:#5a2738; color:#ffd7de}
    .pill{
      display:inline-flex; align-items:center; gap:.5ch; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
      background:#162542; margin-left:auto; font-weight:600;
    }
    .pill .onair-dot{width:10px; height:10px; border-radius:50%; background:#445}
    .pill.on .onair-dot{background:#ff3344; box-shadow:0 0 12px #ff3344}
    .layout{display:grid; grid-template-columns: 370px 1fr; gap:16px; margin-top:16px}
    .card{background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden}
    .artbox{position:relative; aspect-ratio:1/1; background:#0e172a; display:flex; align-items:center; justify-content:center}
    .artbox img{max-width:100%; max-height:100%}
    .meta{padding:12px}
    .title{font-size:20px; font-weight:700; margin:0 0 6px}
    #story{white-space:normal; overflow-wrap:anywhere; color:var(--muted); margin:8px 0 0}
    .controls{display:flex; flex-wrap:wrap; gap:8px; padding:12px}
    .bar{padding:12px; border-top:1px solid var(--line)}
    .bar .time{display:flex; align-items:center; gap:10px}
    input[type="range"]{width:100%}
    .list{max-height:460px; overflow:auto; padding:6px}
    .row{display:grid; grid-template-columns: 24px 1fr auto; gap:10px; align-items:center; padding:8px 10px; border-radius:12px; cursor:pointer}
    .row:hover{background:#121f3a}
    .row .idx{opacity:.65; text-align:right}
    .row .name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .tog{display:inline-flex; align-items:center; gap:.6ch}
    /* Intro overlay */
    .overlay{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(180deg, rgba(0,0,0,.40), rgba(0,0,0,.75));
      backdrop-filter:saturate(1.1) blur(2px); z-index:50;
    }
    .panel{
      width:min(680px, 92vw); background:rgba(9,14,26,.92); border:1px solid var(--line);
      border-radius:20px; box-shadow:var(--shadow); padding:20px;
    }
    .panel h2{margin:0 0 8px}
    .muted{color:var(--muted)}
    .hidden{display:none !important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .foot{display:flex; justify-content:space-between; align-items:center; color:var(--muted); padding:10px 0 20px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button id="toLobby" class="btn">⬅︎ Return to Lobby</button>
      <div id="onAir" class="pill"><span class="onair-dot"></span><strong>ON AIR</strong></div>
    </div>

    <div class="layout">
      <section class="card">
        <div class="artbox"><img id="art" alt="Current track artwork" src="Media/default.jpg"></div>
        <div class="meta">
          <h1 id="trackTitle" class="title">—</h1>
          <p id="story" class="muted">Welcome to KZAK. Select a track or press Start Station.</p>
        </div>
        <div class="controls">
          <button id="startBtn" class="btn primary">▶︎ Start Station</button>
          <button id="pauseBtn" class="btn">⏸ Pause Station</button>
          <button id="prevBtn" class="btn">⏮ Prev</button>
          <button id="nextBtn" class="btn">⏭ Next</button>
          <button id="forceBreakBtn" class="btn">📣 Force Break</button>
          <label class="tog"><input id="breaksToggle" type="checkbox" checked> Station Breaks: On</label>
          <button id="shareBtn" class="btn" title="Share current track">📤 Share Track</button>
          <button id="muteBtn" class="btn" title="Mute">🔇 Mute</button>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
        <div class="bar">
          <div class="time">
            <span id="elapsed">0:00</span>
            <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
            <span id="remaining">-0:00</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="bar"><strong>Playlist</strong></div>
        <div id="list" class="list" role="listbox" aria-label="Playlist"></div>
      </section>
    </div>

    <div class="foot"> 
      <span>KZAK • Frasier-Style Free Radio without the talking</span>
      <span>Copyright 2025: zdjimas and cjmurphy creators and authors</span>
    </div>
  </div>

  <!-- Hidden media elements -->
  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  <audio id="breakAudio" preload="auto" class="sr-only"></audio>
  <video id="exitVideo" class="hidden" src="Media/FrasierExit.mp4" playsinline></video>

  <!-- Intro overlay -->
  <div id="intro" class="overlay">
    <div class="panel">
      <h2>Welcome to KZAK</h2>
      <p class="muted">A short welcome plays before you enter the control booth. You can listen or skip.</p>
      <div style="display:flex; gap:8px; margin-top:10px">
        <button id="playWelcome" class="btn">▶︎ Play Welcome</button>
        <button id="skipWelcome" class="btn primary">Skip & Enter</button>
      </div>
      <audio id="welcome" src="Media/KZAK-Welcome.mp3" preload="auto"></audio>
    </div>
  </div>

  <script>
  /* ========= Config & Data (UNCLE7) ========= */
  const DEFAULT_IMG = 'Media/default.jpg';
  const DEFAULT_STORY = 'Enjoy the music. Hover or tap items to jump around the set. Artwork falls back automatically if the exact file is missing.';
  const ENABLE_MEDIA_SESSION = true;    // flip to false to disable lock-screen/CarPlay controls
  const SEEK_STEP = 15;                 // seconds
  const breakEvery = 2;                 // after N completed tracks, schedule a station break

  // NOTE: Replace/expand PLAYLIST with your full set. Long stories use backticks to avoid escaping quotes.
  const PLAYLIST = [
    {
      title: "My Last Rose of Summer",
      file: "Media/My Last Rose of Summer.mp3",
      image: "Media/RoseSummerMine.jpeg",
      alt: "Cover art for My Last Rose of Summer",
      story: `A wonderful creation of an earlier recipe for this music being like a glass of fine wine. This song brings out many different feelings for me when I first heard it.`
    },
    {
      title: "Your Last Rose of Summer",
      file: "Media/Your Last Rose of Summer.mp3",
      image: "Media/RoseSummerYours.jpeg",
      alt: "Cover art for Your Last Rose of Summer",
      story: `Another creative remix of an obscure deep track from a band you may never expect would write this.`
    },
    {
      title: "My Suite Madam Bleu (Take 2)",
      file: "Media/My Suite Madam Bleu (Take 2).mp3",
      image: "Media/Bleu2.jpeg",
      alt: "Cover art for Suite Madam Bleu — Take 2",
      story: `A creative interpretation of a well loved melody that I played over and over as an early teenager.`
    }
    // Paste additional objects here; ensure commas between objects and no trailing comma after the last
  ];

  // Breaks: configure your files under MediaBreaks/ (Snappy vs IDs for alternation)
  const BREAKS = {
    snappy: [
      "MediaBreaks/Snappy1.mp3",
      "MediaBreaks/Snappy2.mp3",
      "MediaBreaks/Snappy3.mp3"
    ],
    id: [
      "MediaBreaks/ID1.mp3",
      "MediaBreaks/ID2.mp3",
      "MediaBreaks/ID3.mp3"
    ]
  };

  /* ========= Helpers ========= */
  const $ = (sel, el=document)=>el.querySelector(sel);
  const $$ = (sel, el=document)=>Array.from(el.querySelectorAll(sel));

  function pathToUrl(p){
    if (!p) return '';
    // encode each segment except slashes
    return p.split('/').map((seg,i)=> i===0 ? seg : encodeURIComponent(seg)).join('/');
  }

  function fmtTime(sec){
    if (!isFinite(sec)) return '0:00';
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec/60);
    const s = sec%60;
    return m + ':' + (s<10? '0'+s : s);
  }

  /* ========= State ========= */
  const audio = $('#audio');
  const breakAudio = $('#breakAudio');
  const art = $('#art');
  const titleEl = $('#trackTitle');
  const storyEl = $('#story');
  const onAir = $('#onAir');
  const listEl = $('#list');
  const scrub = $('#scrub');
  const elapsed = $('#elapsed');
  const remaining = $('#remaining');

  let idx = 0;
  let completedSinceBreak = 0;
  let wantBreak = false;
  let lastBreakType = 'id'; // force alternation; first will be 'snappy'
  let lastBreakFile = '';
  let metaTimeout = null, stallTimeout = null;

  /* ========= UI Wiring ========= */
  $('#startBtn').addEventListener('click', ()=>{ playCurrent(); });
  $('#pauseBtn').addEventListener('click', ()=>{ audio.pause(); });
  $('#prevBtn').addEventListener('click', prev);
  $('#nextBtn').addEventListener('click', next);
  $('#muteBtn').addEventListener('click', ()=>{ audio.muted = !audio.muted; });
  $('#vol').addEventListener('input', (e)=>{ audio.volume = +e.target.value; });
  $('#forceBreakBtn').addEventListener('click', ()=> playBreak(true));
  $('#breaksToggle').addEventListener('change', e=>{ if(!e.target.checked) wantBreak=false; });
  $('#shareBtn').addEventListener('click', shareTrack);
  $('#toLobby').addEventListener('click', exitToLobby);

  scrub.addEventListener('input', (e)=>{
    if (!audio.duration) return;
    const frac = +e.target.value / 1000;
    audio.currentTime = audio.duration * frac;
  });

  audio.addEventListener('timeupdate', ()=>{
    if (!audio.duration) return;
    elapsed.textContent = fmtTime(audio.currentTime);
    remaining.textContent = '-' + fmtTime(Math.max(0, Math.floor(audio.duration - audio.currentTime)));
    scrub.value = Math.floor((audio.currentTime / audio.duration) * 1000);
  });

  audio.addEventListener('playing', ()=> setOnAir(true));
  audio.addEventListener('pause', ()=> setOnAir(false));

  audio.addEventListener('ended', ()=>{
    completedSinceBreak++;
    if ($('#breaksToggle').checked && completedSinceBreak >= breakEvery){
      wantBreak = true;
      completedSinceBreak = 0;
      playBreak(false /* userForced */);
    } else {
      next();
    }
  });

  audio.addEventListener('loadedmetadata', ()=>{
    if (metaTimeout){ clearTimeout(metaTimeout); metaTimeout=null; }
    if (stallTimeout){ clearTimeout(stallTimeout); stallTimeout=null; }
  });

  audio.addEventListener('error', ()=>{
    console.warn('Audio error, skipping:', current()?.file);
    next();
  });

  function setOnAir(isOn){
    onAir.classList.toggle('on', !!isOn && !audio.paused && !audio.ended);
  }

  function current(){ return PLAYLIST[idx]; }

  function setArtworkFor(tr){
    const src = pathToUrl(tr.image || tr.img || DEFAULT_IMG);
    art.src = src;
    art.onerror = ()=>{ art.src = DEFAULT_IMG; };
    art.alt = tr.alt || ('Cover for ' + (tr.title||'Track'));
  }

  function load(i){
    if (i<0) i = PLAYLIST.length-1;
    if (i>=PLAYLIST.length) i = 0;
    idx = i;
    const tr = current();
    titleEl.textContent = tr.title || '—';
    storyEl.textContent = tr.story || DEFAULT_STORY;
    setArtworkFor(tr);
    const src = pathToUrl(tr.file);
    audio.src = src;
    // metadata and stall guards
    if (metaTimeout) clearTimeout(metaTimeout);
    if (stallTimeout) clearTimeout(stallTimeout);
    metaTimeout = setTimeout(()=>{
      console.warn('Metadata timeout, auto-skipping:', tr.title);
      next();
    }, 12000); // 12s
    stallTimeout = setTimeout(()=>{
      if (audio.currentTime < 0.5){ // not progressing
        console.warn('Playback stall detected, skipping:', tr.title);
        next();
      }
    }, 5000); // 5s stall guard
  }

  function prev(){ load(idx-1); playCurrent(); }
  function next(){ load(idx+1); playCurrent(); }

  function playCurrent(){
    audio.play().catch(err=>{
      console.warn('Play failed (user gesture likely needed):', err);
    });
    updateMediaSession();
    highlightActive();
  }

  function highlightActive(){
    $$('.row', listEl).forEach((row, i)=> row.style.background = (i===idx ? '#142447' : 'transparent'));
  }

  /* ========= Station Breaks ========= */
  function pickBreak(){
    const type = (lastBreakType === 'id') ? 'snappy' : 'id';
    const pool = BREAKS[type] || [];
    if (!pool.length) return null;
    // avoid immediate repeat
    let file = pool[Math.floor(Math.random()*pool.length)];
    if (file === lastBreakFile && pool.length > 1){
      file = pool[(pool.indexOf(file)+1) % pool.length];
    }
    lastBreakType = type;
    lastBreakFile = file;
    return { type, file };
  }

  function playBreak(userForced){
    if (!$('#breaksToggle').checked && !userForced){
      next(); return;
    }
    const choice = pickBreak();
    if (!choice){ next(); return; }
    // Avoid overlap: pause main audio, then play break
    audio.pause();
    breakAudio.src = pathToUrl(choice.file);
    breakAudio.onended = ()=>{
      if (userForced){ /* resume same track */ audio.play().catch(()=>{}); }
      else { next(); }
    };
    breakAudio.onerror = ()=>{ console.warn('Break failed, continuing'); userForced ? audio.play().catch(()=>{}) : next(); };
    breakAudio.play().catch(err=>{ console.warn('Break play failed:', err); userForced ? audio.play().catch(()=>{}) : next(); });
    wantBreak = false;
  }

  /* ========= Playlist Rendering ========= */
  function renderList(){
    listEl.innerHTML = '';
    PLAYLIST.forEach((tr,i)=>{
      const row = document.createElement('div');
      row.className = 'row';
      row.setAttribute('role','option');
      row.innerHTML = `
        <div class="idx">${i+1}</div>
        <div class="name">${tr.title || 'Untitled'}</div>
        <div class="len">▶︎</div>
      `;
      row.addEventListener('click', ()=>{ load(i); playCurrent(); });
      listEl.appendChild(row);
    });
    highlightActive();
  }

  /* ========= Share ========= */
  async function shareTrack(){
    const tr = current();
    const title = tr?.title || 'KZAK';
    const text = 'Listening on KZAK • Frasier-Style Free Radio';
    // Deep link can include track index if your router supports it; here we just add ?t=idx
    const url = location.href.replace(/(\?|#).*$/,'') + '?t=' + idx;
    if (navigator.share){
      try{ await navigator.share({title, text, url}); }catch(e){ /* user cancelled */ }
    } else {
      try{
        await navigator.clipboard.writeText(url);
        alert('Share link copied to clipboard.');
      }catch(_){
        prompt('Copy this link:', url);
      }
    }
  }

  /* ========= Media Session ========= */
  function updateMediaSession(){
    if (!('mediaSession' in navigator) || !ENABLE_MEDIA_SESSION) return;
    const tr = current();
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: tr?.title || 'KZAK',
        artist: 'KZAK Radio',
        album: 'Frasier-Style Fun Radio',
        artwork: [{ src: art?.src || DEFAULT_IMG, sizes: '512x512', type: 'image/jpeg' }]
      });
      navigator.mediaSession.setActionHandler('play', ()=> audio.play().catch(()=>{}));
      navigator.mediaSession.setActionHandler('pause', ()=> audio.pause());
      navigator.mediaSession.setActionHandler('previoustrack', prev);
      navigator.mediaSession.setActionHandler('nexttrack', next);
      navigator.mediaSession.setActionHandler('seekbackward', (d)=>{ try{ audio.currentTime = Math.max(0, audio.currentTime - (d?.seekOffset||SEEK_STEP)); }catch(_){}});
      navigator.mediaSession.setActionHandler('seekforward',  (d)=>{ try{ audio.currentTime = Math.min(audio.duration||audio.currentTime+SEEK_STEP, audio.currentTime + (d?.seekOffset||SEEK_STEP)); }catch(_){}});
      navigator.mediaSession.setActionHandler('seekto',       (d)=>{ try{ if (d?.seekTime!=null) audio.currentTime = d.seekTime; }catch(_){}});
    }catch(_){}
  }

  /* ========= Intro / Exit ========= */
  const intro = $('#intro');
  const welcome = $('#welcome');

  $('#playWelcome').addEventListener('click', ()=>{
    welcome.currentTime = 0;
    welcome.play().catch(()=>{});
  });

  $('#skipWelcome').addEventListener('click', enterRoom);
  welcome.addEventListener('ended', enterRoom);

  function enterRoom(){
    intro.classList.add('hidden');
    // defer boot until overlay dismissed
    load(0);
  }

  async function exitToLobby(){
    const exitVideo = $('#exitVideo');
    try{
      exitVideo.classList.remove('hidden');
      // fullscreen intro-like overlay
      const ov = document.createElement('div');
      ov.className = 'overlay';
      ov.style.background = 'rgba(0,0,0,.92)';
      ov.appendChild(exitVideo);
      document.body.appendChild(ov);
      exitVideo.currentTime = 0;
      await exitVideo.play();
      await new Promise(res=> exitVideo.onended = res);
    }catch(_){
      // fallback: brief delay
      await new Promise(r=>setTimeout(r, 1200));
    }
    // navigate back to lobby (parent directory index.html)
    location.href = './index.html'.replace('/room-radio-listen/index.html','/index.html');
  }

  /* ========= Boot ========= */
  (function boot(){
    renderList();
    // Deep link index ?t=
    const t = new URLSearchParams(location.search).get('t');
    if (t && !isNaN(+t)) idx = Math.max(0, Math.min(PLAYLIST.length-1, +t));
    // Don't autoload until intro dismissed
  })();
  </script>
</body>
</html>
