<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bullwinkle-v1.032 Controller Wrapper</title>
  <style>
    /* Cosmetic: banner & playlist cap (safe if IDs/classes exist) */
    #genreCallout32 {
      display:flex; align-items:center; justify-content:center; gap:10px;
      margin: 8px auto 8px; padding: 10px 14px; max-width: 720px;
      background: linear-gradient(180deg, #2a3f68 0%, #1f3154 100%);
      color: #fff; font-weight: 800; font-size: 16px; letter-spacing: .2px;
      border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35); text-align: center;
    }
    #plist .items { max-height: 460px; overflow-y: auto; overscroll-behavior: contain; }
  </style>
</head>
<body>
  <!--
    NOTE: This wrapper assumes your existing page provides the full UI.
    If you want to merge just the working logic, copy the <script type="module"> block below
    into your current page (before </body>). Keep the three playlist-*.js files next to it.
  -->

  <div id="genreCallout32" role="note" aria-label="Genre instruction">
    <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:rgba(255,255,255,.14);font-size:14px;margin-right:6px;">♪</span>
    <span>Select the <u>Genre</u> you want the station to play for this session</span>
  </div>

  <script>
    // Ensure a global PLAYLIST exists for legacy code
    window.PLAYLIST = window.PLAYLIST || [];
  </script>

  <script type="module">
    /* Bullwinkle-v1.032 — robust external-list controller */
    import HEAVY  from './playlist-heavy.js';
    import ROCK   from './playlist-rock.js';
    import MELLOW from './playlist-mellow.js';

    const MAP = new Map([
      ['heavy and metal', {list: HEAVY,  label: 'Heavy and Metal'}],
      ['middle ground rock', {list: ROCK, label: 'Middle Ground Rock'}],
      ['mellow tunes', {list: MELLOW, label: 'Mellow Tunes'}],
    ]);

    function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }

    function mutate(list){
      const dst = window.PLAYLIST;
      if (!Array.isArray(dst)) { window.PLAYLIST = []; }
      (window.PLAYLIST).splice(0, window.PLAYLIST.length, ...list);
    }

    function setHeader(label){
      try{
        const strong = document.querySelector('#plist .head strong');
        const count  = document.getElementById('countRight');
        if (strong) strong.textContent = 'Playlist — ' + label;
        if (count)  count.textContent  = (window.PLAYLIST?.length || 0) + ' items';
      }catch{}
    }

    function updateNowGenre(i=0){
      try{
        const el = document.getElementById('genreNow'); if (!el) return;
        const t = window.PLAYLIST?.[i|0];
        const g = (t && t.genre) ? String(t.genre).replace(/\s+/g,' ').trim() : '';
        if (g) el.textContent = 'Genre: ' + g;
      }catch{}
    }

    // Fallback renderer if legacy buildList didn't repaint
    function fallbackRender(){
      const pane = document.querySelector('#plist .items'); if (!pane) return;
      if (pane._v032rendered && pane.childElementCount === window.PLAYLIST.length) return;
      pane._v032rendered = true;
      pane.innerHTML = '';
      window.PLAYLIST.forEach((t,i)=>{
        const row = document.createElement('div');
        row.className = 'row';
        row.style.cssText = 'display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);';
        row.addEventListener('click', ()=>{
          if (typeof window.load === 'function') window.load(i,true);
        });
        const left = document.createElement('div');
        left.textContent = String(i+1).padStart(3,'0') + ' ' + (t.title || '(untitled)');
        const right = document.createElement('div');
        right.textContent = t.genre || '';
        right.style.cssText = 'opacity:.7;font-size:12px;';
        row.appendChild(left); row.appendChild(right);
        pane.appendChild(row);
      });
    }

    function repaint(){
      if (typeof window.buildList === 'function') window.buildList();
      // verify repaint; fallback if needed
      const pane = document.querySelector('#plist .items');
      const ok = !!(pane && pane.childElementCount === window.PLAYLIST.length && window.PLAYLIST.length);
      if (!ok) fallbackRender();
    }

    function playFromStart(){
      if (typeof window.load === 'function'){
        if (window.PLAYLIST?.length) window.load(0, true);
      }
      updateNowGenre(0);
    }

    function activate(labelText){
      const entry = MAP.get(norm(labelText)) || MAP.get('middle ground rock');
      mutate(entry.list);
      repaint();
      setHeader(entry.label);
      playFromStart();
      // Toggle active class on visible genre buttons
      document.querySelectorAll('[data-genre]').forEach(b=>{
        b.classList.toggle('active', norm(b.textContent) === norm(entry.label));
      });
    }

    // Wire genre bar and any duplicate pills
    function wire(){
      const bar = document.getElementById('genreBar');
      if (bar && !bar._wired032){
        bar._wired032 = true;
        bar.addEventListener('click', (ev)=>{
          const btn = ev.target.closest('[data-genre]'); if (!btn) return;
          activate(btn.textContent);
        });
      }
      // Remove any "ALL" buttons and wire other visible pills
      document.querySelectorAll('button, .btn, .pill, .chip').forEach(el=>{
        const k = norm(el.textContent);
        if (k === 'all'){ el.remove(); }
        if (MAP.has(k) && !el._wired032){
          el._wired032 = true;
          el.addEventListener('click', ()=> activate(el.textContent));
        }
      });
      // Move the banner directly above the kept bar if both exist
      const callout = document.getElementById('genreCallout32');
      if (callout && bar && callout.nextElementSibling !== bar){
        bar.parentNode.insertBefore(callout, bar);
      }
    }

    // Hook load() once to keep genre label accurate
    (function hookLoad(){
      const attempt = () => {
        if (typeof window.load !== 'function') return false;
        if (window.load._v032) return true;
        const _load = window.load;
        window.load = function(i, autoplay){
          const r = _load(i, autoplay);
          updateNowGenre(i);
          return r;
        };
        window.load._v032 = true;
        return true;
      };
      if (!attempt()){
        const t = setInterval(()=>{ if (attempt()) clearInterval(t); }, 100);
      }
    })();

    // Boot when legacy functions are around
    (function init(){
      const t = setInterval(()=>{
        wire();
        if (typeof window.buildList === 'function' && typeof window.load === 'function'){
          clearInterval(t);
          // Default to ROCK
          activate('Middle Ground Rock');
        }
      }, 120);
    })();
  </script>
</body>
</html>
